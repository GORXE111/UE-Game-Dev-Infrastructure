    # SampleGame native updates: independent of signed content channels and the website.
    location ~ "^/samplegame/([a-z][a-z0-9_-]{0,31})/native/(manifest\.json(?:\.sig)?)$" {
        limit_except GET HEAD { deny all; }
        alias /srv/ue-game-updates/native/$1/current/$2;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ "^/samplegame/([a-z][a-z0-9_-]{0,31})/native/versions/([1-9][0-9]{0,8})/(libUnreal\.so|native-windows\.zip)$" {
        limit_except GET HEAD { deny all; }
        alias /srv/ue-game-updates/native/$1/releases/$2/versions/$2/$3;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
