    # SampleGame player downloads: independent immutable archives; game channels unchanged.
    location = /samplegame/players/manifest.json {
        limit_except GET HEAD { deny all; }
        alias /srv/ue-game-updates/players/current/manifest.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ "^/samplegame/players/releases/([a-z0-9][a-z0-9._-]{0,63})/(SampleGame-[A-Za-z0-9][A-Za-z0-9._-]{0,150}\.(?:zip|apk)(?:\.sha256)?)$" {
        limit_except GET HEAD { deny all; }
        alias /srv/ue-game-updates/players/releases/$1/$2;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
    }
