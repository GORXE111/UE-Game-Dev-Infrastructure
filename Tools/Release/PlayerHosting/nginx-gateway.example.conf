# Install as /etc/nginx/sites-available/updates.example.com and enable it.
# Replace the example hostname and TLS certificate paths for your deployment.
# Install the two .locations.conf fragments at the paths shown below.
server {
    listen 443 ssl;
    server_name updates.example.com;
    ssl_certificate /etc/nginx/tls/updates.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/updates.example.com.key;

    autoindex off;
    gzip off;
    error_page 404 = @samplegame_missing;

    # SampleGame player downloads: configured through the reviewed fragment.
    include /etc/nginx/snippets/samplegame-player.locations.conf;
    include /etc/nginx/snippets/samplegame-native.locations.conf;

    # Signed manifest and signature:
    location ~ "^/samplegame/(?<current_channel>[a-z][a-z0-9_-]{0,31})/updates/(?<current_file>manifest[.]json(?:[.]sig)?)$" {
        limit_except GET { deny all; }
        alias /srv/ue-game-updates/channels/$current_channel/current/$current_file;
        types { application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/samplegame/(?<release_channel>[a-z][a-z0-9_-]{0,31})/updates/versions/(?<release_id>[1-9][0-9]{0,8})/(?<release_file>(?=.{1,200}$)(?:manifest[.]json(?:[.]sig)?|release-display[.]json|payload/(?:[A-Za-z0-9_.-]{1,128}/)*[A-Za-z0-9_.-]{1,128}))$" {
        limit_except GET { deny all; }
        alias /srv/ue-game-updates/channels/$release_channel/releases/$release_id/versions/$release_id/$release_file;
        error_page 404 = @samplegame_missing;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @samplegame_missing {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    location / { return 404; }
}
